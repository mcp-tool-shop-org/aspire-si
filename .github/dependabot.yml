version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
    groups:
      ml-frameworks:
        patterns:
          - "torch*"
          - "transformers*"
          - "datasets*"
          - "accelerate*"
          - "peft*"
          - "bitsandbytes*"
      api-clients:
        patterns:
          - "anthropic*"
          - "openai*"
          - "httpx*"
      dev-tools:
        patterns:
          - "pytest*"
          - "ruff*"
          - "pyright*"
          - "bandit*"
          - "mypy*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
