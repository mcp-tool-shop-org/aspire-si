name: CI

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "aspire/**"
      - "integrations/**"
      - "tests/**"
      - "examples/**"
      - "atlas/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "aspire/**"
      - "integrations/**"
      - "tests/**"
      - "examples/**"
      - "atlas/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # Codecov upload over OIDC; no stored token
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        # CPU torch: the tests mock the models, and the CUDA wheels are gigabytes.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: matrix.python-version == '3.12'
        with:
          node-version: 22

      - name: Atlas check
        if: matrix.python-version == '3.12'
        run: npx --yes @dogfood-lab/atlas@1.24.0 check

      - name: Ruff check
        run: ruff check aspire/

      - name: Pyright
        run: pyright aspire/
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          pytest tests/ -q --tb=short --ignore=tests/integration --timeout=30 -n 4 \
            --cov=aspire --cov=integrations --cov-report=xml --cov-report=term-missing:skip-covered \
            --cov-fail-under=90

      - name: Geometry demo writes ScalarScope exports
        run: python examples/geometry_demo.py outputs/geometry-demo

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.python-version == '3.12'
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: coverage.xml

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*

  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install pip-audit
      - run: pip-audit --strict --desc || true
