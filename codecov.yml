# The bar is 90% line and branch coverage of aspire/ and integrations/, on the whole project
# and on the lines a pull request changes. CI enforces the same number with
# `pytest --cov-fail-under=90` before this upload.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  hide_project_coverage: false
  require_changes: false
