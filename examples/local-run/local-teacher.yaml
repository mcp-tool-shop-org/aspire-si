# A short ASPIRE run that costs nothing: a 1B student, a 3B local teacher.
# Llama 3.2 is gated on Hugging Face: accept its licence there and `hf auth login` first,
# or set student.model_name_or_path to an open model such as Qwen/Qwen2.5-0.5B-Instruct.
# Fits a 24 GB GPU. Run from the repository root:
#   aspire train --config examples/local-run/local-teacher.yaml --prompts examples/local-run/prompts.json --geometry
experiment_name: local-teacher
seed: 42
student:
  model_name_or_path: meta-llama/Llama-3.2-1B-Instruct
  max_length: 1024
teacher:
  default_teacher: local
  local_model_path: Qwen/Qwen2.5-3B-Instruct
  max_dialogue_turns: 2
training:
  num_epochs: 2
  batch_size: 2
  gradient_accumulation_steps: 1
  output_dir: outputs/local-teacher
