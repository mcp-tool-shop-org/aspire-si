# The same run with two local teachers voting: Qwen2.5-3B and Phi-4-mini.
# Each teacher's score is kept, so ScalarScope draws one professor each.
#   aspire train --config examples/local-run/composite-teacher.yaml --prompts examples/local-run/prompts.json --geometry
experiment_name: composite-teacher
seed: 42
student:
  model_name_or_path: meta-llama/Llama-3.2-1B-Instruct
  max_length: 1024
teacher:
  default_teacher: composite
  composite_members:
    - local:Qwen/Qwen2.5-3B-Instruct
    - local:microsoft/Phi-4-mini-instruct
  composite_strategy: vote
  max_dialogue_turns: 2
training:
  num_epochs: 2
  batch_size: 2
  gradient_accumulation_steps: 1
  output_dir: outputs/composite-teacher
